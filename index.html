<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Localhost Router</title>
    <script>
      (function redirectToLocalhost() {
        var target =
          "http://localhost:5173" +
          window.location.pathname +
          window.location.search +
          window.location.hash;

        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <noscript>
      Enable JavaScript to route this page to localhost.
    </noscript>
  </body>
</html>
