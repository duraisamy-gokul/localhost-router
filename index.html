<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Localhost Router</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
    <script>
      (function loadLocalhostFrame() {
        var target =
          "http://localhost:5173" +
          window.location.pathname +
          window.location.search +
          window.location.hash;

        window.addEventListener("DOMContentLoaded", function () {
          document.getElementById("localhost-frame").src = target;
        });
      })();
    </script>
  </head>
  <body>
    <iframe
      id="localhost-frame"
      title="Localhost app"
      allow="clipboard-read; clipboard-write; fullscreen; camera; microphone; geolocation"
    ></iframe>
    <noscript>
      Enable JavaScript to load the localhost app.
    </noscript>
  </body>
</html>
